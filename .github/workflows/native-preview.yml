name: React Native preview

on:
  workflow_call:
    inputs:
      project-name: { required: true, type: string }
      xos-ref:
        description: Full immutable XOS SDK commit used by the runner.
        required: true
        type: string
      actions-ref:
        description: Full immutable preview-actions commit used by the runner.
        required: true
        type: string
      project-adapter: { required: false, default: react_native, type: string }
      application-identifier: { required: false, default: "", type: string }
      app-store-connect-api-key-id: { required: false, default: "", type: string }
      apple-team-id: { required: false, default: "", type: string }
      project-path: { required: false, default: ".", type: string }
      required-commands: { required: false, default: "", type: string }
      command-subject: { required: false, default: "", type: string }
      pull-request-number: { required: false, default: "", type: string }
      preview-request-id: { required: false, default: "", type: string }
      signing-build-id: { required: false, default: "", type: string }
      signing-platform: { required: false, default: "", type: string }
      device-preparation-id: { required: false, default: "", type: string }
      reissue-source-sha: { required: false, default: "", type: string }
      signing-application-identifier: { required: false, default: "", type: string }
      signing-environment: { required: false, default: "", type: string }
      build-signing-environment:
        description: Protected GitHub environment used to sign an initial iOS preview.
        required: false
        default: ""
        type: string
      build-host: { required: false, default: https://builds.xlate.ai, type: string }
      preview-title: { required: false, default: "", type: string }
      preview-what-changed: { required: false, default: "", type: string }
      preview-what-to-test: { required: false, default: "", type: string }
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: { required: false }
      APP_STORE_CONNECT_ISSUER_ID: { required: false }
      APP_STORE_CONNECT_API_KEY: { required: false }
      APPLE_TEAM_ID: { required: false }
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: { required: false }
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_STORE_PASSWORD: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  XOS_CLOUD_API_URL: ${{ vars.XOS_CLOUD_API_URL || 'https://xlate.ai' }}
  ASC_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  request:
    runs-on: ubuntu-latest
    outputs:
      run-ios: ${{ steps.validate.outputs.run-ios }}
      run-android: ${{ steps.validate.outputs.run-android }}
    steps:
      - name: Validate immutable preview request
        id: validate
        shell: bash
        env:
          ADAPTER: ${{ inputs.project-adapter }}
          APPLICATION_IDENTIFIER: ${{ inputs.application-identifier }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.app-store-connect-api-key-id || vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
          COMMAND: ${{ inputs.command-subject }}
          PROJECT_PATH: ${{ inputs.project-path }}
          SDK_REF: ${{ inputs.xos-ref }}
          ACTIONS_REF: ${{ inputs.actions-ref }}
          BUILD_HOST: ${{ inputs.build-host }}
          SIGNING_BUILD_ID: ${{ inputs.signing-build-id }}
          SIGNING_PLATFORM: ${{ inputs.signing-platform }}
          SIGNING_IDENTIFIER: ${{ inputs.signing-application-identifier }}
          SIGNING_ENVIRONMENT: ${{ inputs.signing-environment }}
          BUILD_SIGNING_ENVIRONMENT: ${{ inputs.build-signing-environment }}
          PREPARATION_ID: ${{ inputs.device-preparation-id }}
          REISSUE_SOURCE_SHA: ${{ inputs.reissue-source-sha }}
        run: |
          set -euo pipefail
          [[ "$ADAPTER" == react_native ]] || { echo '::error::Only react_native is supported'; exit 1; }
          [[ "$APPLICATION_IDENTIFIER" =~ ^[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+$ ]] || { echo '::error::application-identifier is invalid'; exit 1; }
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::xos-ref must be a full commit SHA'; exit 1; }
          [[ "$ACTIONS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::actions-ref must be a full commit SHA'; exit 1; }
          [[ "$PROJECT_PATH" != /* && "$PROJECT_PATH" != *..* ]] || { echo '::error::project-path must stay inside the repository'; exit 1; }
          [[ "$BUILD_HOST" == https://builds.xlate.ai ]] || { echo '::error::build-host is not approved'; exit 1; }
          case "$COMMAND" in
            ''|'/preview'|'/preview(ios)'|'/preview(android)') ;;
            *) echo '::error::command-subject is not a supported exact preview command'; exit 1 ;;
          esac
          if [[ -n "$SIGNING_BUILD_ID" ]]; then
            [[ "$SIGNING_BUILD_ID" =~ ^build_[A-Za-z0-9_-]{16,120}$ ]] || { echo '::error::signing-build-id is invalid'; exit 1; }
            [[ "$SIGNING_PLATFORM" == ios ]] || { echo '::error::This release supports iOS signing only'; exit 1; }
            [[ "$SIGNING_IDENTIFIER" =~ ^[A-Za-z0-9_]+([.][A-Za-z0-9_]+)+$ ]] || { echo '::error::signing application identity is invalid'; exit 1; }
            [[ "$SIGNING_ENVIRONMENT" =~ ^xos-preview-[A-Za-z0-9_-]{8,120}$ ]] || { echo '::error::signing environment is invalid'; exit 1; }
          elif [[ -n "$SIGNING_PLATFORM$SIGNING_IDENTIFIER$SIGNING_ENVIRONMENT$PREPARATION_ID$REISSUE_SOURCE_SHA" ]]; then
            echo '::error::Signing-only inputs require signing-build-id'
            exit 1
          fi
          if [[ -n "$PREPARATION_ID" ]]; then
            [[ "$PREPARATION_ID" =~ ^(prepare|prep)_[A-Za-z0-9_-]{16,193}$ ]] || { echo '::error::device preparation identity is invalid'; exit 1; }
            [[ "$REISSUE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::reissue source must be an exact commit'; exit 1; }
          fi
          if [[ "$COMMAND" == /preview || "$COMMAND" == '/preview(ios)' ]]; then
            [[ "$BUILD_SIGNING_ENVIRONMENT" =~ ^xos-preview-[A-Za-z0-9_-]{8,120}$ ]] || { echo '::error::An approved build-signing-environment is required for iOS'; exit 1; }
            echo 'run-ios=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run-ios=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$COMMAND" == /preview || "$COMMAND" == '/preview(android)' ]]; then
            echo 'run-android=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run-android=false' >> "$GITHUB_OUTPUT"
          fi

  react-native-build:
    name: Compile React Native iOS preview
    needs: request
    if: inputs.signing-build-id == '' && needs.request.outputs.run-ios == 'true'
    permissions:
      actions: write
      contents: read
      pull-requests: write
      id-token: write
    runs-on: macos-26
    environment: ${{ inputs.build-signing-environment }}
    defaults:
      run: { shell: bash }
    env:
      XOS_PREVIEW_APPLICATION_IDENTIFIER: ${{ inputs.application-identifier }}
    steps:
      - name: Check out pinned public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xlateai/preview-actions
          ref: ${{ inputs.actions-ref }}
          path: .xlate-preview-actions
          persist-credentials: false

      - name: Validate runner checkout
        env: { ACTIONS_REF: "${{ inputs.actions-ref }}" }
        run: |
          test "$(git -C .xlate-preview-actions rev-parse HEAD)" = "$ACTIONS_REF"
          test -z "$(git -C .xlate-preview-actions status --porcelain)"

      - name: Set up pinned Xlate Preview CLI
        uses: ./.xlate-preview-actions/.github/actions/setup-preview-cli

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }

      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .xlate-project
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked project dependencies
        env: { PROJECT_PATH: "${{ inputs.project-path }}" }
        run: |
          set -euo pipefail
          cd ".xlate-project/$PROJECT_PATH"
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          else
            echo '::error::A supported lockfile is required'
            exit 1
          fi

      - name: Prepare application-native iOS dependencies
        env: { PROJECT_PATH: "${{ inputs.project-path }}" }
        run: |
          set -euo pipefail
          cd ".xlate-project/$PROJECT_PATH"
          if ! node -e 'const p=require("./package.json"); process.exit(p.scripts?.["xlate:prepare:ios"] ? 0 : 1)'; then
            echo 'No xlate:prepare:ios package script; continuing without app-specific preparation'
          elif [[ -f package-lock.json ]]; then
            npm run xlate:prepare:ios
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack pnpm run xlate:prepare:ios
          elif [[ -f yarn.lock ]]; then
            corepack yarn run xlate:prepare:ios
          else
            echo '::error::A supported lockfile is required for xlate:prepare:ios'
            exit 1
          fi

      - name: Resolve the application's Apple team
        run: python3 .xlate-preview-actions/scripts/resolve-preview-apple-team.py

      - name: Configure ephemeral iOS signing
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.app-store-connect-api-key-id || vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ inputs.app-store-connect-api-key-id || vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          P12_PATH: ${{ runner.temp }}/xlate-preview-distribution.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/xlate-preview.keychain-db
        run: |
          set -euo pipefail
          APPLE_TEAM_ID="${APPLE_TEAM_ID:-$XOS_PREVIEW_EXPECTED_APPLE_TEAM_ID}"
          [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::App Store Connect key ID is invalid'; exit 1; }
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required for iOS previews"; exit 1; }
          done
          [[ "$XOS_PREVIEW_EXPECTED_APPLE_TEAM_ID" == "$APPLE_TEAM_ID" ]] || {
            echo '::error::Configured Apple team does not match the control-plane binding'
            exit 1
          }
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | sed 's/\\n/\n/g' > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          if [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:-}" ]]; then
            [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]]
            printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
            keychain_password="$(openssl rand -hex 24)"
            security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
            security import "$P12_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          elif [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]]; then
            echo '::error::Certificate password was configured without a certificate'
            exit 1
          fi
          echo "ASC_PRIVATE_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Compile, sign, and publish iOS build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ inputs.app-store-connect-api-key-id || vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_PATH: ${{ inputs.project-path }}
          BUILD_HOST: ${{ inputs.build-host }}
          XOS_PREVIEW_TITLE: ${{ inputs.preview-title }}
          XOS_PREVIEW_WHAT_CHANGED: ${{ inputs.preview-what-changed }}
          XOS_PREVIEW_WHAT_TO_TEST: ${{ inputs.preview-what-to-test }}
          XOS_PREVIEW_PR: ${{ inputs.pull-request-number }}
          XOS_PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
          XOS_PREVIEW_IDEMPOTENCY_KEY: github:${{ github.repository_id }}:${{ inputs.preview-request-id || github.run_id }}:${{ github.run_attempt }}
          XOS_BROKERED_GITHUB_PUBLISHER: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xlate-preview-result-ios.json"
          xlate preview ".xlate-project/$PROJECT_PATH" --ios --local \
            --host "$BUILD_HOST" --title "$XOS_PREVIEW_TITLE" \
            --changed "$XOS_PREVIEW_WHAT_CHANGED" --test "$XOS_PREVIEW_WHAT_TO_TEST" --json \
            | tee "$RUNNER_TEMP/build.ndjson"
          python3 .xlate-preview-actions/scripts/extract-preview-result.py \
            "$RUNNER_TEMP/build.ndjson" "$output"

      - name: Retain unsigned input after a failed handoff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xlate-signing-input-${{ github.run_id }}-ios
          include-hidden-files: true
          path: ~/.xos/previews/*/*.xcarchive.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload preview result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xlate-preview-result-${{ inputs.preview-request-id }}-ios
          path: ${{ runner.temp }}/xlate-preview-result-ios.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral signing material
        if: always()
        env: { KEYCHAIN_PATH: "${{ runner.temp }}/xlate-preview.keychain-db" }
        run: |
          if [[ -f "$KEYCHAIN_PATH" ]]; then security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/xlate-preview-distribution.p12"

      - name: Share preview on its pull request
        if: inputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["page_url"])' "$RUNNER_TEMP/xlate-preview-result-ios.json")"
          marker='<!-- xlate-react-native-preview:ios -->'
          body="$marker"$'\n'"React Native iOS preview for commit $GITHUB_SHA: $url"
          payload="$RUNNER_TEMP/comment.json"
          python3 -c 'import json,sys; json.dump({"body":sys.argv[1]},open(sys.argv[2],"w"))' "$body" "$payload"
          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi

  ios-sign-preview:
    name: Sign and publish iOS preview
    needs: request
    if: inputs.signing-build-id != '' && inputs.signing-platform == 'ios' && needs.request.outputs.run-ios == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: macos-26
    environment: ${{ inputs.signing-environment }}
    defaults:
      run: { shell: bash }
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      XOS_PREVIEW_APPLICATION_IDENTIFIER: ${{ inputs.signing-application-identifier }}
    steps:
      - name: Check out pinned public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xlateai/preview-actions
          ref: ${{ inputs.actions-ref }}
          path: .xlate-preview-actions
          persist-credentials: false

      - name: Validate runner checkout
        env: { ACTIONS_REF: "${{ inputs.actions-ref }}" }
        run: |
          test "$(git -C .xlate-preview-actions rev-parse HEAD)" = "$ACTIONS_REF"
          test -z "$(git -C .xlate-preview-actions status --porcelain)"

      - name: Set up pinned Xlate Preview CLI
        uses: ./.xlate-preview-actions/.github/actions/setup-preview-cli

      - name: Resolve the application's Apple team
        run: python3 .xlate-preview-actions/scripts/resolve-preview-apple-team.py

      - name: Configure ephemeral iOS signing
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          P12_PATH: ${{ runner.temp }}/xlate-preview-distribution.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/xlate-preview.keychain-db
        run: |
          set -euo pipefail
          APPLE_TEAM_ID="${APPLE_TEAM_ID:-$XOS_PREVIEW_EXPECTED_APPLE_TEAM_ID}"
          [[ "$APP_STORE_CONNECT_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo '::error::App Store Connect key ID is invalid'; exit 1; }
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is required for iOS previews"; exit 1; }
          done
          [[ "$XOS_PREVIEW_EXPECTED_APPLE_TEAM_ID" == "$APPLE_TEAM_ID" ]] || {
            echo '::error::Configured Apple team does not match the control-plane binding'
            exit 1
          }
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | sed 's/\\n/\n/g' > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          if [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64:-}" ]]; then
            [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]]
            printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$P12_PATH"
            keychain_password="$(openssl rand -hex 24)"
            security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
            security import "$P12_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          elif [[ -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" ]]; then
            echo '::error::Certificate password was configured without a certificate'
            exit 1
          fi
          {
            echo "ASC_PRIVATE_KEY_PATH=$ASC_KEY_PATH"
            echo "XOS_PREVIEW_IDEMPOTENCY_KEY=github:${{ github.repository_id }}:${{ inputs.preview-request-id || github.run_id }}:${{ github.run_attempt }}"
            echo "XOS_PREVIEW_PR=${{ inputs.pull-request-number }}"
          } >> "$GITHUB_ENV"

      - name: Sign and publish iOS preview
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xlate-ios-preview.ndjson"
          if [[ -n "${{ inputs.device-preparation-id }}" ]]; then
            xlate preview reissue ./ --build "${{ inputs.signing-build-id }}" \
              --operation "${{ inputs.device-preparation-id }}" \
              --host "${{ inputs.build-host }}" --json | tee "$output"
          else
            xlate preview sign ./ --platform ios --build "${{ inputs.signing-build-id }}" \
              --host "${{ inputs.build-host }}" --json | tee "$output"
          fi
          python3 .xlate-preview-actions/scripts/extract-preview-result.py \
            "$output" "$RUNNER_TEMP/xlate-preview-result-ios.json"

      - name: Remove ephemeral signing material
        if: always()
        env: { KEYCHAIN_PATH: "${{ runner.temp }}/xlate-preview.keychain-db" }
        run: |
          if [[ -f "$KEYCHAIN_PATH" ]]; then security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/xlate-preview-distribution.p12"

  react-native-android-build:
    name: Compile React Native Android preview
    needs: request
    if: inputs.signing-build-id == '' && needs.request.outputs.run-android == 'true'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run: { shell: bash }
    env:
      XOS_PREVIEW_APPLICATION_IDENTIFIER: ${{ inputs.application-identifier }}
    steps:
      - name: Check out pinned public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xlateai/preview-actions
          ref: ${{ inputs.actions-ref }}
          path: .xlate-preview-actions
          persist-credentials: false

      - name: Validate runner checkout
        env: { ACTIONS_REF: "${{ inputs.actions-ref }}" }
        run: |
          test "$(git -C .xlate-preview-actions rev-parse HEAD)" = "$ACTIONS_REF"
          test -z "$(git -C .xlate-preview-actions status --porcelain)"

      - name: Set up pinned Xlate Preview CLI
        uses: ./.xlate-preview-actions/.github/actions/setup-preview-cli

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }

      - name: Configure Android preview signing
        env:
          CONNECTED_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONNECTED_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONNECTED_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CONNECTED_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/xlate-preview-android.p12"
          configured=0
          for value in "$CONNECTED_KEYSTORE" "$CONNECTED_ALIAS" "$CONNECTED_STORE_PASSWORD" "$CONNECTED_KEY_PASSWORD"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" == 4 ]]; then
            printf '%s' "$CONNECTED_KEYSTORE" | base64 --decode > "$keystore"
            alias="$CONNECTED_ALIAS"
            store_password="$CONNECTED_STORE_PASSWORD"
            key_password="$CONNECTED_KEY_PASSWORD"
          elif [[ "$configured" == 0 ]]; then
            alias=xlate-preview
            store_password="$(openssl rand -hex 24)"
            key_password="$store_password"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" \
              -storepass "$store_password" -keypass "$key_password" -alias "$alias" \
              -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Xlate Ephemeral Preview,O=Xlate'
          else
            echo '::error::Android signing secrets must be configured as a complete set'
            exit 1
          fi
          chmod 600 "$keystore"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "XOS_ANDROID_KEYSTORE_PATH=$keystore"
            echo "XOS_ANDROID_KEY_ALIAS=$alias"
            echo "XOS_ANDROID_STORE_PASSWORD=$store_password"
            echo "XOS_ANDROID_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Check out application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .xlate-project
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked project dependencies
        env: { PROJECT_PATH: "${{ inputs.project-path }}" }
        run: |
          set -euo pipefail
          cd ".xlate-project/$PROJECT_PATH"
          if [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          else
            echo '::error::A supported lockfile is required'
            exit 1
          fi

      - name: Compile and publish Android build
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_PATH: ${{ inputs.project-path }}
          BUILD_HOST: ${{ inputs.build-host }}
          XOS_PREVIEW_TITLE: ${{ inputs.preview-title }}
          XOS_PREVIEW_WHAT_CHANGED: ${{ inputs.preview-what-changed }}
          XOS_PREVIEW_WHAT_TO_TEST: ${{ inputs.preview-what-to-test }}
          XOS_PREVIEW_PR: ${{ inputs.pull-request-number }}
          XOS_PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
          XOS_PREVIEW_IDEMPOTENCY_KEY: github:${{ github.repository_id }}:${{ inputs.preview-request-id || github.run_id }}:${{ github.run_attempt }}
          XOS_BROKERED_GITHUB_PUBLISHER: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/xlate-preview-result-android.json"
          xlate preview ".xlate-project/$PROJECT_PATH" --android --local \
            --host "$BUILD_HOST" --title "$XOS_PREVIEW_TITLE" \
            --changed "$XOS_PREVIEW_WHAT_CHANGED" --test "$XOS_PREVIEW_WHAT_TO_TEST" --json \
            | tee "$RUNNER_TEMP/build-android.ndjson"
          python3 .xlate-preview-actions/scripts/extract-preview-result.py \
            "$RUNNER_TEMP/build-android.ndjson" "$output"

      - name: Upload preview result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xlate-preview-result-${{ inputs.preview-request-id }}-android
          path: ${{ runner.temp }}/xlate-preview-result-android.json
          if-no-files-found: error
          retention-days: 1

      - name: Share preview on its pull request
        if: inputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["page_url"])' "$RUNNER_TEMP/xlate-preview-result-android.json")"
          marker='<!-- xlate-react-native-preview:android -->'
          body="$marker"$'\n'"React Native Android preview for commit $GITHUB_SHA: $url"
          payload="$RUNNER_TEMP/comment-android.json"
          python3 -c 'import json,sys; json.dump({"body":sys.argv[1]},open(sys.argv[2],"w"))' "$body" "$payload"
          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi

  final-check:
    name: Final check
    if: always() && !cancelled()
    needs: [request, react-native-build, ios-sign-preview, react-native-android-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected lane
        shell: bash
        env:
          REQUEST_RESULT: ${{ needs.request.result }}
          RUN_IOS: ${{ needs.request.outputs.run-ios }}
          RUN_ANDROID: ${{ needs.request.outputs.run-android }}
          SIGNING_BUILD_ID: ${{ inputs.signing-build-id }}
          BUILD_RESULT: ${{ needs.react-native-build.result }}
          SIGN_RESULT: ${{ needs.ios-sign-preview.result }}
          ANDROID_RESULT: ${{ needs.react-native-android-build.result }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_RESULT" == success ]]
          if [[ "$RUN_IOS" == true && -z "$SIGNING_BUILD_ID" ]]; then [[ "$BUILD_RESULT" == success ]]; fi
          if [[ "$RUN_IOS" == true && -n "$SIGNING_BUILD_ID" ]]; then [[ "$SIGN_RESULT" == success ]]; fi
          if [[ "$RUN_ANDROID" == true && -z "$SIGNING_BUILD_ID" ]]; then [[ "$ANDROID_RESULT" == success ]]; fi
